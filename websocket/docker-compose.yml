services:
  mongodb:
    image: mongo
    container_name: mongo_db
    ports:
      - 27017:27017
    volumes:
      - mongo:/data
    environment:
      - ***REMOVED***
      - ***REMOVED***
  mongo-express:
    image: mongo-express
    container_name: mongo_express
    restart: always
    ports:
      - 8081:8081
    environment:
      - ***REMOVED***
      - ***REMOVED***
      - ME_CONFIG_MONGODB_SERVER=mongodb
volumes:
  mongo: {}